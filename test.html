<!DOCTYPE html>
<html>

<head>
    <title>Scam Simulation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            font-family: Arial;
            overflow: hidden;
        }

        body {
            background: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-bottom: 1px solid #ddd;
            background: #f7f7f8;
        }

        .back {
            font-size: 28px;
            color: #34c759;
            padding-right: 80px;
        }

        .contact {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgb(167, 166, 166);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .name {
            font-size: 13px;
            font-weight: bold;
        }

        .status {
            font-size: 11px;
            color: #777;
        }

        .call {
            font-size: 20px;
            padding-left: 50px;
            color: green;
        }

        .menu {
            font-size: 25px;
            padding-left: 1px;
            color: green;
        }

        #chat {
            flex: 1;
            padding: 10px;
            overflow: auto;
        }

        .message {
            background: #e5e5ea;
            padding: 10px;
            border-radius: 18px;
            margin: 4px 0;
            max-width: 80%;
        }

        .reply {
            background: #34c759;
            color: white;
            margin-left: auto;
            padding-left: 20px;
        }

        #options {
            padding: 10px;
            padding-bottom: 80px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border: none;
            border-radius: 10px;
            background: #b8c5ff;
            font-size: 16px;
        }

        .fail-overlay,
        .pass-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .fail-overlay {
            background: red;
        }

        .pass-overlay {
            background: green;
        }

        .fail-overlay button,
        .pass-overlay button {
            width: 150px;
            background: white;
            margin-top: 20px;
            font-weight: bold;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 480px) {
            body {
                background: #ddd;
                justify-content: center;
                align-items: center;
            }

            .app {
                width: 380px;
                height: 700px;
                max-height: 90vh;
                background: white;
                border-radius: 30px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="header">
            <span class="back">&#8249;</span>
            <div class="contact">
                <span class="avatar">
                    <span style="font-size:30px; margin-top:10%;">🙍‍♂️</span>
                </span>
                <div class="name">Unknown Number</div>
                <div class="status">Mobile</div>
            </div>
            <span class="call">&#128222;</span>
            <span class="menu">&#9776;</span>
        </div>

        <div id="chat"></div>
        <div id="options"></div>
    </div>

    <script>
        let chat = document.getElementById("chat");
        let options = document.getElementById("options");

        function message(text, user) {
            if (user == true) {
                chat.innerHTML += "<div class='message reply'>" + text + "</div>";
            } else {
                chat.innerHTML += "<div class='message'>" + text + "</div>";
            }
            chat.scrollTop = chat.scrollHeight;
        }

        function showOptions(one, two) {
            options.innerHTML = "";

            let b1 = document.createElement("button");
            b1.innerHTML = one.text;
            b1.onclick = one.action;

            let b2 = document.createElement("button");
            b2.innerHTML = two.text;
            b2.onclick = two.action;

            options.appendChild(b1);
            options.appendChild(b2);
        }

        message(
            "Hi, it's John from Deakin University. I am currently using the repair shop's phone because my phone is being repaired. Can you do me a quick favour? I need your help with something urgent.",
            false
        );

        showOptions(
            {
                text: "Yes, how can I help?",
                action: function () {
                    message("Yes, how can I help?", true);
                    secondMessage();
                }
            },
            {
                text: "Can I call you to confirm this is you?",
                action: function () {
                    message("Can I call you to confirm this is you?", true);
                    secondMessage();
                }
            }
        );

        function secondMessage() {
            message(
                "I am currently at the repair shop to fix my phone. I have an urgent payment that needs to be completed today, but I do not have access to my banking system right now. Could you please help me process a $500 payment? I will send you the account details.",
                false
            );

            showOptions(
                {
                    text: "Sure, send me the payment details.",
                    action: function () {
                        message("Sure, send me the payment details.", true);
                        failed();
                    }
                },
                {
                    text: "Sorry, I cannot help with this until I can verify who you are.",
                    action: function () {
                        message("Sorry, I cannot help with this until I can verify who you are.", true);
                        passed();
                    }
                }
            );
        }

        function passed() {
            document.body.innerHTML =
                "<div class='pass-overlay'>" +
                "<h1>HURRAY YOU PASSED!!</h1>" +
                "<p>You verified the request before taking action.</p>" +
                "<button onclick='location.reload()'>Restart</button>" +
                "</div>";
        }

        function failed() {
            document.body.innerHTML =
                "<div class='fail-overlay'>" +
                "<h1>YOU FAILED</h1>" +
                "<p>The attacker used impersonation and urgency.</p>" +
                "<button onclick='location.reload()'>Restart</button>" +
                "</div>";
        }
    </script>
</body>

</html>
